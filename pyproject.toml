[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgphi"
version = "1.0.0rc1"
description = "Exact rational radix–Möbius dynamics, nonnested extremal targets, and finite modular traps"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Facundo Firmenich", email = "f.firmenich@cedesur.org" }
]
keywords = [
  "arithmetic dynamics", "rational dynamics", "radix transformations",
  "Möbius transformations", "Farey geometry", "dynamic programming",
  "finite traps", "computer-assisted proof"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["networkx>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/FacundoFirmenich/rgphi-radix-mobius-dynamics"
Repository = "https://github.com/FacundoFirmenich/rgphi-radix-mobius-dynamics"
Issues = "https://github.com/FacundoFirmenich/rgphi-radix-mobius-dynamics/issues"

[project.scripts]
rgphi = "rgphi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
