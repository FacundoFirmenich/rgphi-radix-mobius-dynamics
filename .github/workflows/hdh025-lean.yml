name: HDH-025 Lean formal gate

on:
  push:
    branches: ["hdh-025-formal-gate"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof placeholders
        run: |
          if grep -R -n -E '\b(sorry|admit|axiom)\b' research/experimental/hdh025_formal --include='*.lean'; then
            echo 'Unproved placeholder detected' >&2
            exit 1
          fi
      - name: Install pinned Lean via elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib dependency
        working-directory: research/experimental/hdh025_formal
        run: |
          lake --version
          lake update
      - name: Restore Mathlib oleans
        working-directory: research/experimental/hdh025_formal
        run: lake exe cache get
      - name: Compile theorem with warnings as errors
        working-directory: research/experimental/hdh025_formal
        shell: bash
        run: |
          set +e
          lake build --wfail 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          {
            echo '## HDH-025 Lean build log'
            echo '```text'
            cat lean-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
