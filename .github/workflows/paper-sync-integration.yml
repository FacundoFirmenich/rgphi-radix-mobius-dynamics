name: Temporary paper PDF synchronization

on:
  push:
    branches: [codex/integrate-publication-deployment-001-2026-10-28]
    paths:
      - "paper/main.tex"
      - ".github/workflows/paper-sync-integration.yml"

permissions:
  contents: write

jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/integrate-publication-deployment-001-2026-10-28
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Compile tracked PDF
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Commit synchronized PDF
        run: |
          if git diff --quiet -- paper/main.pdf; then
            echo "paper/main.pdf already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf
          git commit -m "Synchronize Paper I PDF with corrected source"
          git push origin HEAD:codex/integrate-publication-deployment-001-2026-10-28
