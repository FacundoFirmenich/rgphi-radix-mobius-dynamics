name: Finalize Paper I candidate

on:
  push:
    branches:
      - paper-i/finalization-2026-10-29
      - paper-i/literature-hardening-2026-10-29
    paths:
      - "scripts/paper_i/finalize_p1.py"
      - "scripts/paper_i/finalize_p1_postfix.py"
      - ".github/workflows/paper-i-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate deterministic Paper I finalization
        run: |
          python scripts/paper_i/finalize_p1.py
          python scripts/paper_i/finalize_p1_postfix.py
      - name: Install package and run exact regression checks
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_paper_i_finalization.py
          rgphi verify
          python scripts/paper_i/verify_receipt.py
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Compile candidate twice
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Commit generated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper docs/validation tests/test_paper_i_finalization.py
          if ! git diff --cached --quiet; then
            git commit -m "Harden Paper I literature positioning"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
