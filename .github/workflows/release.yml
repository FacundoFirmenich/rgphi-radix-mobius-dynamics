name: Release verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest && rgphi verify && python -m build
      - name: Verify checksums when present
        run: |
          if [ -f SHA256SUMS.txt ]; then sha256sum -c SHA256SUMS.txt; fi
